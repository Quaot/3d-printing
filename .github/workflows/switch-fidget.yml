name: switch-fidget

on:
  push:
    paths:
      - "projects/switch-fidget/**"
      - ".github/workflows/switch-fidget.yml"
  pull_request:
    paths:
      - "projects/switch-fidget/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/switch-fidget
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python check.py
      - run: python build.py
      - uses: actions/upload-artifact@v4
        with:
          name: switch-fidget-parts
          path: projects/switch-fidget/out/
